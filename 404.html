<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b6bcb" />
    <title>Không tìm thấy trang – Trợ lý TPT Đội</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        box-sizing: border-box;
        background: #f4f7fa;
        color: #172235;
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Arial,
          sans-serif;
      }
      .card {
        max-width: 520px;
        background: #fff;
        border: 1px solid #dce4ec;
        border-radius: 16px;
        padding: 26px;
        box-shadow: 0 15px 45px rgba(10, 55, 100, 0.12);
        text-align: center;
      }
      h1 {
        font-size: 22px;
        color: #0a3764;
      }
      a {
        display: inline-block;
        padding: 9px 14px;
        background: #0b6bcb;
        color: #fff;
        border-radius: 8px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Không tìm thấy trang</h1>
      <p>
        Đường dẫn có thể đã nhập sai hoặc repository GitHub Pages đã đổi tên.
        Hãy quay về tệp index ở gốc website.
      </p>
      <a href="./index.html">Mở ứng dụng</a>
      <p>
        <small
          >Nếu tên repository thay đổi, cần tạo lại app-config.js và kiểm tra
          cấu hình Pages.</small
        >
      </p>
    </main>
  </body>
</html>
